services:
  ds2api:
    image: ghcr.io/cjackhwang/ds2api:latest
    container_name: ds2api
    restart: always
    env_file:
      - .env
    ports:
      # Host port is configurable via DS2API_HOST_PORT; container port stays fixed at 5001.
      - "${DS2API_HOST_PORT:-6011}:5001"
    volumes:
      # 挂载目录而不是单文件，便于容器以非 root 用户原子写入 /data/config.json。
      # 首次启动前请确保宿主机 ./data 目录存在，并且容器用户（uid:gid 默认为 ds2api 系统账号）有读写权限：
      #   mkdir -p ./data && [ -f ./data/config.json ] || cp config.json ./data/config.json 2>/dev/null || true
      #   sudo chown -R 999:999 ./data
      - ./data:/data   # 配置文件持久化目录
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - DS2API_ADMIN_KEY=${DS2API_ADMIN_KEY:-ds2api}
      - DS2API_CONFIG_PATH=/data/config.json
